name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build plugin and extension
        run: npm run build
      - name: Bridge and MCP checks (fake plugin)
        run: npm run verify
      - name: Angelo format round trip
        run: npm run roundtrip
      - name: Web-to-Figma offline corpus
        run: npm run web-check
      - name: Web-to-Figma orchestrator failure paths
        run: npm run web-to-figma-check
      - name: npm package build
        run: node npm/build.mjs
