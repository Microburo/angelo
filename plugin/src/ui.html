          if (f.type === "note-error") {
            if (!settle(f.ref, f.error)) notify(`${f.op}: ${f.error}`);
            return true;
          }
          if (f.type === "note-img") {
            onImage(f);
            return true;
          }
          return f.type === "notes-comments";
        }

        function refilter(force) {
          const key = effectiveKey();
          items = key ? allItems.filter((i) => i.fileKey === key) : allItems.slice();
          renderBadge();
          const sig = JSON.stringify(items);
          if (force || sig !== lastSig) {
            lastSig = sig;
            if (notesOpen) renderList();
            syncMarkers();
          }
        }

        function connected(on) {
          if (on) send({ type: "notes-get" });
          else {
            perms = [];
            renderPerms();
            for (const [ref] of waits) settle(ref, "bridge closed");
            setOnline(false, false);
          }
        }

        // ---------- the bar: open, fold, badge ----------
        function open(save = true) {
          if (notesOpen) return;
          notesOpen = true;
          document.body.classList.add("open");
          post({ type: "panel", open: true });
          parent.postMessage({ pluginMessage: { kind: "size", width: normalSize.w, height: normalSize.h, anchor: "top" } }, "*");
          sizeSent = -1;
          lastSig = "";
          refilter(true);
          if (save) setTimeout(() => $("note").focus(), 50);
        }
        function fold() {
          if (!notesOpen) return;
          setOpts(false);
          notesOpen = false;
          document.body.classList.remove("open");
          post({ type: "panel", open: false });
          sizeSent = -1;
          fit();
        }
        $("notesBtn").onclick = () => (notesOpen ? fold() : open(true));
        // minimize: the window keeps only the input (top edge stays put); the same button restores it
        let mini = false;
        let miniW = 360; // the minimized window keeps its own width, dragged from the same corner
        const miniH = () => Math.ceil(document.querySelector(".field").getBoundingClientRect().height) + 8 + 12;
        const miniSize = () => {
          if (!mini) return;
          const h = miniH();
          parent.postMessage({ pluginMessage: { kind: "size", width: miniW, height: h, anchor: "top" } }, "*");
        };
        function setMini(on) {
          if (on === mini) return;
          mini = on;
          setOpts(false);
          document.body.classList.toggle("mini", on);
          if (on) miniSize();
          else parent.postMessage({ pluginMessage: { kind: "size", width: normalSize.w, height: normalSize.h, anchor: "top" } }, "*");
        }
        $("minBtn").onclick = () => setMini(!mini);
        new ResizeObserver(miniSize).observe(document.querySelector(".field"));

        function renderBadge() {
          const live = items.filter((i) => !i.reverted);
          const askN = live.filter((i) => i.status === "question").length + perms.length;
          const busyN = live.filter((i) => i.status === "working" || i.status === "pending").length;
          const b = $("notesBadge");
          const n = askN || busyN;
          b.hidden = !n;
          b.textContent = n ? String(n) : "";
          b.classList.toggle("ask", !!askN);
          $("notesBtn").title = askN ? `${askN} need${askN > 1 ? "" : "s"} an answer` : busyN ? `${busyN} in progress` : "Notes for Claude";
        }

        // ---------- a note typed in the bar, or in Figma's quick actions: it goes out with the selection ----------
        let quickSink = null;
        async function quick(text) {
          text = String(text || "").trim();
          if (!text) return;
          if (!ready || !isOpen()) {
            quickPending = text;
            if (!isOpen()) showStatus("note waits for the bridge…", false);
            return;
          }
          quickPending = null;
          showStatus("sending note…", false);
          try {
            const picked = await new Promise((resolve) => {
              const timer = setTimeout(() => {
                quickSink = null;
                resolve([]);
              }, 4000);
              quickSink = (list) => {
                clearTimeout(timer);
                quickSink = null;
                resolve(list);
              };
              post({ type: "add-selection" });
            });
            const nodes = picked.map(toNode);
            const id = await ask({ type: "note-create", note: { ...baseDraft(), nodes, note: text } });
            showStatus(`note #${id} sent to Claude`, true);
          } catch (error) {
            showStatus(`note not sent: ${error.message}`, true);
          }
        }

        // ---------- the current selection ----------
        function renderTarget() {
          // nothing selected and nothing added: the block stays out of the way
          document.querySelector(".ctx").hidden = !wholeFile() && !sel.nodes.length && !targets.length;
          if (wholeFile()) {
            $("tName").textContent = "Whole file";
            $("tMeta").textContent = `Every page of ${ctx.fileName ? "“" + ctx.fileName + "”" : "this file"}.`;
          } else if (!sel.nodes.length) {
            $("tName").textContent = targets.length ? `${targets.length} added` : "Nothing selected";
            $("tMeta").textContent = targets.length ? "Select more to add them too." : `The note is about the page${ctx.pageName ? " “" + ctx.pageName + "”" : ""}.`;
          } else {
            const first = sel.nodes[0];
            $("tName").textContent = sel.total > 1 ? `${first.name} + ${sel.total - 1} more` : first.name;
            $("tMeta").textContent = sel.total > 1 ? `${sel.total} layers selected` : `${first.type.toLowerCase()} · ${first.w}×${first.h}`;
          }
          updateSend();
        }

        // ---------- targets ----------
        function requestTargets() {
          return new Promise((resolve) => {
            pendingAdd = resolve;
            post({ type: "add-selection" });
          });
        }
        function onTargetsAdded(list) {
          if (quickSink) return quickSink(list);
          for (const t of list) {
            if (targets.some((x) => x.id === t.id)) continue;
            targets.push(t);
          }
          renderTargets();
          if (pendingAdd) {
            pendingAdd();
            pendingAdd = null;
          }
          renderTarget();
        }
        function renderTargets() {
          $("targets").hidden = !targets.length;
          $("targets").innerHTML = targets
            .map((t, i) => {
              return `<span class="tchip" title="${esc(t.name)}"><span class="tn">${esc(t.name)}</span><button class="x" type="button" data-rm-target="${i}" title="Remove">${ICON.x}</button></span>`;
            })
            .join("");
        }
        function clearTargets() {
          targets.forEach((t) => t.url && URL.revokeObjectURL(t.url));
          targets = [];
          renderTargets();
        }
        $("targets").addEventListener("click", (e) => {
          const rm = e.target.closest("[data-rm-target]");
          if (!rm) return;
          const [gone] = targets.splice(Number(rm.dataset.rmTarget), 1);
          if (gone && gone.url) URL.revokeObjectURL(gone.url);
          renderTargets();
          renderTarget();
        });
        $("addSel").onclick = async () => {
          if (!sel.nodes.length) return;
          $("addSel").disabled = true;
          await requestTargets();
          updateSend();
        };

        const toBase64 = (bytes) => {
          let s = "";
          const CH = 0x8000;
          for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
          return btoa(s);
        };

        // ---------- files: photos and anything else ----------
        const MAX_FILES = 8;
        const MAX_FILE_MB = 12;
        const MAX_TOTAL_MB = 40;
        const MIME = { pdf: "application/pdf", md: "text/markdown", txt: "text/plain", json: "application/json", csv: "text/csv", svg: "image/svg+xml", zip: "application/zip", gif: "image/gif", mp4: "video/mp4", mov: "video/quicktime", fig: "application/octet-stream" };
        const extOf = (name) => {
          const m = /\.([A-Za-z0-9]{1,6})$/.exec(name || "");
          return m ? m[1].toLowerCase() : "";
        };
        const fmtSize = (n) => (n < 1024 ? n + " B" : n < 1048576 ? Math.round(n / 1024) + " KB" : (n / 1048576).toFixed(1) + " MB");

        async function addFiles(list) {
          for (const f of list) await addFile(f);
        }
        async function addFile(f) {
          if (!f) return;
          if (files.length >= MAX_FILES) return notify(`Up to ${MAX_FILES} files per note`);
          if (f.size > MAX_FILE_MB * 1048576) return notify(`${f.name || "File"} is over ${MAX_FILE_MB} MB`);
          if (files.reduce((a, x) => a + x.size, 0) + f.size > MAX_TOTAL_MB * 1048576) return notify(`Over ${MAX_TOTAL_MB} MB in total`);
          const photo = f.type.startsWith("image/") && !["image/svg+xml", "image/gif"].includes(f.type);
          if (photo && (await addPhoto(f))) return;
          await addRaw(f);
        }
        // photos are scaled to 1600 px and saved as PNG or JPEG, which Claude and Figma both read
        async function addPhoto(f) {
          try {
            const bmp = await createImageBitmap(f);
            const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
            const w = Math.max(1, Math.round(bmp.width * scale));
            const h = Math.max(1, Math.round(bmp.height * scale));
            const c = document.createElement("canvas");
            c.width = w;
            c.height = h;
            const g = c.getContext("2d");
            const png = f.type === "image/png";
            if (!png) {
              g.fillStyle = "#fff";
              g.fillRect(0, 0, w, h);
            }
            g.drawImage(bmp, 0, 0, w, h);
            const blob = await new Promise((r) => c.toBlob(r, png ? "image/png" : "image/jpeg", 0.9));
            const bytes = new Uint8Array(await blob.arrayBuffer());
            const base = (f.name || "photo").replace(/\.[^.]+$/, "");
            files.push({ name: `${base}.${png ? "png" : "jpg"}`, mime: blob.type, size: bytes.length, data: toBase64(bytes), preview: URL.createObjectURL(blob), isImage: true });
            renderFiles();
            return true;
          } catch (err) {
            return false; // e.g. HEIC: fall back to attaching the original
          }
        }
        async function addRaw(f) {
          try {
            const bytes = new Uint8Array(await f.arrayBuffer());
            const mime = f.type || MIME[extOf(f.name)] || "application/octet-stream";
            const previewable = ["image/svg+xml", "image/gif"].includes(mime);
            files.push({ name: f.name || "file", mime, size: bytes.length, data: toBase64(bytes), preview: previewable ? URL.createObjectURL(f) : null, isImage: previewable });
            renderFiles();
          } catch (err) {
            notify("Could not read " + (f.name || "that file"));
          }
        }
        function renderFiles() {
          const box = $("files");
          box.hidden = !files.length;
          box.innerHTML = files
            .map((p, i) =>
              p.isImage && p.preview
                ? `<span class="athumb" title="${esc(p.name)} · ${fmtSize(p.size)}" style="background-image:url(${p.preview})"><button class="x" type="button" data-rm-file="${i}" title="Remove">${ICON.x}</button></span>`
                : `<span class="fchip" title="${esc(p.name)} · ${fmtSize(p.size)}"><span class="ext">${esc((extOf(p.name) || "file").slice(0, 4).toUpperCase())}</span><span class="fn">${esc(p.name)}</span><span class="muted">${fmtSize(p.size)}</span><button class="x" type="button" data-rm-file="${i}" title="Remove">${ICON.x}</button></span>`
            )
            .join("");
          $("addFile").disabled = files.length >= MAX_FILES;
          $("fileHint").textContent = files.length > 1 ? `${files.length}/${MAX_FILES}` : "";
        }
        function clearFiles() {
          files.forEach((p) => p.preview && URL.revokeObjectURL(p.preview));
          files = [];
          renderFiles();
        }
        $("addFile").onclick = () => $("fileInput").click();
        $("fileInput").addEventListener("change", async (e) => {
          await addFiles([...e.target.files]);
          e.target.value = "";
        });
        $("files").addEventListener("click", (e) => {
          const rm = e.target.closest("[data-rm-file]");
          if (!rm) return;
          const [gone] = files.splice(Number(rm.dataset.rmFile), 1);
          if (gone && gone.preview) URL.revokeObjectURL(gone.preview);
          renderFiles();
        });
        // files dropped on the bar or pasted while it is folded open the panel
        async function attach(list) {
          open(false);
          await addFiles(list);
        }

        // drag and drop anywhere on the panel (the drop itself is routed by the bar); paste from the clipboard
        const hasFiles = (dt) => !!dt && [...(dt.types || [])].includes("Files");
        const filesFrom = (dt) => {
          const out = [];
          if (!dt) return out;
          if (dt.items && dt.items.length) {
            for (const it of dt.items) {
              if (it.kind !== "file") continue;
              const f = it.getAsFile();
              if (f) out.push(f);
            }
          }
          if (!out.length && dt.files) out.push(...dt.files);
          return out;
        };
        let dragDepth = 0;
        document.addEventListener("dragenter", (e) => {
          if (!hasFiles(e.dataTransfer)) return;
          e.preventDefault();
          dragDepth++;
          document.body.classList.add("dragging");
        });
        document.addEventListener("dragover", (e) => {
          if (!hasFiles(e.dataTransfer)) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = "copy";
        });
        document.addEventListener("dragleave", (e) => {
          if (!hasFiles(e.dataTransfer)) return;
          dragDepth = Math.max(0, dragDepth - 1);
          if (!dragDepth) document.body.classList.remove("dragging");
        });
        document.addEventListener("drop", () => {
          dragDepth = 0;
          document.body.classList.remove("dragging");
        });
        document.addEventListener("paste", async (e) => {
          const list = filesFrom(e.clipboardData);
          if (!list.length) return;
          e.preventDefault();
          await attach(list);
        });

        // ---------- composing and sending ----------
        // no target is fine: the note is then about the whole page
        const canCompose = () => $("note").value.trim();
        function updateSend() {
          $("send").disabled = !(online && canCompose());
          $("send").title = !online ? "The bridge isn’t running" : !$("note").value.trim() ? "Write a note first" : "Send (↵). New line: ⇧↵";
          $("queue").disabled = !canCompose();
          $("addSel").disabled = !sel.nodes.length;
          $("batchSend").disabled = !online || !drafts.length;
        }

        function seg(id) {
          const root = $(id);
          root.addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            root.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
          });
          return () => root.querySelector(".on").dataset.v;
        }
        const getVariations = seg("variations");
        seg("scope");
        seg("comments");
        seg("refs");
        const getRefs = () => $("refs").querySelector(".on")?.dataset.v || "";
        const getComments = () => $("comments").querySelector(".on")?.dataset.v || "";
        // read from the button itself, so it also works for code that runs before this line
        const wholeFile = () => $("scope").querySelector(".on")?.dataset.v === "file";

        const toNode = (t) => ({ id: t.id, name: t.name, type: t.type, w: t.w, h: t.h, page: t.page, pageId: t.pageId });

        // the targets the designer added; if none, whatever is selected right now
        async function gatherNodes() {
          if (wholeFile()) return [];
          if (targets.length) return targets.map(toNode);
          return sel.nodes.map((n) => ({ ...n, page: ctx.pageName }));
        }
        // a note with every option at its default
        function baseDraft() {
          return {
            fileKey: effectiveKey(), fileName: ctx.fileName, pageName: ctx.pageName, pageId: ctx.pageId,
            nodes: [], note: "", intent: "change", priority: "normal", mentions: [], library: null, variations: 1,
            useComments: null, model: null, modelName: null, skill: null, planFirst: false, references: null, scope: null, attachments: [],
          };
        }
        async function currentDraft() {
          const note = $("note").value.trim();
          return {
            ...baseDraft(),
            nodes: await gatherNodes(),
            note,
            priority: $("urgent").checked ? "urgent" : "normal",
            mentions: mentions.filter((m) => note.includes("@" + m.name)),
            library: $("library").value || null,
            variations: Number(getVariations()),
            useComments: getComments() || null,
            model: $("model").value || null,
            modelName: $("model").value ? $("model").selectedOptions[0].textContent : null,
            skill: $("skill").value || null,
            planFirst: $("planFirst").checked,
            references: getRefs() ? { source: "mobbin", count: Number(getRefs()) } : null,
            scope: wholeFile() ? "file" : null,
            attachments: files.map((p) => ({ name: p.name, mime: p.mime, data: p.data })),
          };
        }
        const postNote = (note) => ask({ type: "note-create", note });

        // versions and comments are per note; the library choice stays
        function resetComposer() {
          $("note").value = "";
          mentions = [];
          hideMentions();
          clearFiles();
          clearTargets();
          const reset = (id, v) => $(id).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === v));
          reset("variations", "1");
          reset("scope", "sel");
          reset("comments", "");
          reset("refs", "");
          $("planFirst").checked = false;
          $("urgent").checked = false;
          optionsSummary();
          showTokenRow();
          renderTarget();
        }

        // options open over the notes and close when you click elsewhere
        function setOpts(show) {
          $("opts").hidden = !show;
          $("optsBtn").setAttribute("aria-expanded", String(show));
          $("optsBtn").classList.toggle("on", show);
        }
        $("optsBtn").onclick = (e) => {
          e.stopPropagation();
          setOpts($("opts").hidden);
        };
        document.addEventListener("mousedown", (e) => {
          if (!$("opts").hidden && !e.target.closest("#opts, #optsBtn")) setOpts(false);
        });
        // a non-default option shows under the note, so a closed menu never hides a choice
        function optionsSummary() {
          const v = getVariations();
          const lib = $("library").value;
          const on = [
            wholeFile() ? "whole file" : "",
            v !== "1" ? v + " versions" : "",
            lib ? (lib === "local" ? "this file only" : lib) : "",
            getComments() ? (getComments() === "summarize" ? "summarize comments" : "apply comments") : "",
            $("model").value ? $("model").selectedOptions[0].textContent : "",
            $("skill").value ? "skill: " + $("skill").value : "",
            $("planFirst").checked ? "plan first" : "",
            getRefs() ? getRefs() + " refs" : "",
            $("urgent").checked ? "urgent" : "",
          ].filter(Boolean);
          $("optsBadge").hidden = !on.length;
          $("optLine").hidden = !on.length;
          $("optLine").textContent = on.join(" · ");
          $("optsBtn").title = on.length ? "Options: " + on.join(", ") : "Options";
        }
        ["library", "model", "skill", "planFirst", "urgent"].forEach((id) => $(id).addEventListener("change", optionsSummary));
        $("comments").addEventListener("click", () => setTimeout(() => (optionsSummary(), showTokenRow())));
        $("refs").addEventListener("click", () => setTimeout(optionsSummary));
        $("variations").addEventListener("click", () => setTimeout(optionsSummary));
        $("scope").addEventListener("click", () => setTimeout(() => (optionsSummary(), renderTarget())));

        async function sendNote() {
          if ($("send").disabled) return;
          $("send").disabled = true;
          try {
            await postNote(await currentDraft());
            resetComposer();
            notify("Sent to Claude");
          } catch (err) {
            notify("Could not send: " + err.message);
          }
          updateSend();
        }

        // ---------- batch ----------
        async function addToBatch() {
          if ($("queue").disabled) return;
          drafts.push(await currentDraft());
          resetComposer();
          renderDrafts();
          updateSend();
        }
        const nodeLabel = (nodes, scope) => {
          if (scope === "file") return "Whole file";
          if (!nodes.length) return "Whole page";
          const names = nodes.slice(0, 2).map((n) => n.name);
          return names.join(", ") + (nodes.length > 2 ? ` +${nodes.length - 2}` : "");
        };
        function renderDrafts() {
          $("batch").hidden = !drafts.length;
          $("batchTitle").textContent = `${drafts.length} note${drafts.length === 1 ? "" : "s"} in batch`;
          $("drafts").innerHTML = drafts
            .map((d, i) => `<div class="draft"><span class="muted">${i + 1}.</span><span class="t" title="${esc(d.note)}">${esc(nodeLabel(d.nodes, d.scope))}: ${esc(d.note)}${d.attachments.length ? ` (+${d.attachments.length})` : ""}</span><button class="x" type="button" data-rm="${i}" title="Remove">${ICON.x}</button></div>`)
            .join("");
        }
        $("drafts").addEventListener("click", (e) => {
          const rm = e.target.closest("[data-rm]");
          if (!rm) return;
          drafts.splice(Number(rm.dataset.rm), 1);
          renderDrafts();
          updateSend();
        });
        $("batchClear").onclick = () => {
          drafts = [];
          renderDrafts();
          updateSend();
        };
        $("batchSend").onclick = async () => {
          if (!drafts.length) return;
          $("batchSend").disabled = true;
          const batchId = "b" + Date.now().toString(36).slice(-5);
          const total = drafts.length;
          try {
            const batchMode = $("parallel").checked ? "parallel" : "order";
            while (drafts.length) {
              await postNote({ ...drafts[0], batchId, batchMode });
              drafts.shift();
              renderDrafts();
            }
            notify(`Sent ${total} notes to Claude`);
          } catch (err) {
            notify(`Sent ${total - drafts.length} of ${total}: ${err.message}`);
          }
          updateSend();
        };

        $("send").onclick = sendNote;
        $("queue").onclick = addToBatch;
        $("note").addEventListener("input", () => {
          updateSend();
          keepBottom();
        });
        $("note").addEventListener("keydown", (e) => {
          if (mentionKey(e)) return;
          if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return; // 229: an input method is still composing
          // Enter sends, Shift+Enter is a new line, ⌘⇧Enter adds to the batch
          if ((e.metaKey || e.ctrlKey) && e.shiftKey) {
            e.preventDefault();
            addToBatch();
            return;
          }
          if (e.shiftKey) return;
          e.preventDefault();
          sendNote();
        });
        // when the note box grows, the newest note stays in view
        let wasAtBottom = true;
        $("scroll").addEventListener(
          "scroll",
          () => {
            const l = $("scroll");
            wasAtBottom = l.scrollHeight - l.scrollTop - l.clientHeight < 40;
          },
          { passive: true }
        );
        function keepBottom() {
          if (wasAtBottom) requestAnimationFrame(() => ($("scroll").scrollTop = $("scroll").scrollHeight));
        }

        // ---------- @mentions ----------
        let mOpts = [];
        let mIndex = 0;
        let mQuery = null;
        function mentionQuery() {
          const ta = $("note");
          const m = /(^|\s)@([^\s@]{0,40})$/.exec(ta.value.slice(0, ta.selectionStart));
          return m ? m[2] : null;
        }
        $("note").addEventListener("input", () => {
          mQuery = mentionQuery();
          if (mQuery === null) return hideMentions();
          post({ type: "mention-search", q: mQuery });
        });
        $("note").addEventListener("blur", () => setTimeout(hideMentions, 150));
        function showMentions(q, results) {
          if (q !== mQuery) return; // an older answer
          mOpts = results;
          mIndex = 0;
          const box = $("mention");
          box.innerHTML = results.length
            ? results.map((r, i) => `<div class="opt${i ? "" : " on"}" data-i="${i}"><b>${esc(r.name)}</b><span>${esc(r.sub)}${r.library ? " · " + esc(r.library) : ""}</span></div>`).join("")
            : `<div class="none">Nothing called “${esc(q)}” in this file or its libraries</div>`;
          box.hidden = false;
        }
        function hideMentions() {
          $("mention").hidden = true;
          mOpts = [];
        }
        function pickMention(i) {
          const r = mOpts[i];
          if (!r) return;
          const ta = $("note");
          const pos = ta.selectionStart;
          const start = ta.value.slice(0, pos).lastIndexOf("@");
          ta.value = ta.value.slice(0, start) + "@" + r.name + " " + ta.value.slice(pos);
          const caret = start + r.name.length + 2;
          ta.setSelectionRange(caret, caret);
          if (!mentions.some((m) => m.kind === r.kind && (m.key || m.id) === (r.key || r.id))) mentions.push(r);
          if (r.kind === "library" && [...$("library").options].some((o) => o.value === r.name)) {
            $("library").value = r.name;
            optionsSummary();
          }
          hideMentions();
          ta.focus();
          updateSend();
        }
        function mentionKey(e) {
          if ($("mention").hidden || !mOpts.length) {
            if (e.key === "Escape") hideMentions();
            return false;
          }
          if (e.key === "ArrowDown" || e.key === "ArrowUp") {
            mIndex = (mIndex + (e.key === "ArrowDown" ? 1 : mOpts.length - 1)) % mOpts.length;
            $("mention").querySelectorAll(".opt").forEach((o, i) => o.classList.toggle("on", i === mIndex));
          } else if ((e.key === "Enter" && !e.metaKey && !e.ctrlKey) || e.key === "Tab") pickMention(mIndex);
          else if (e.key === "Escape") hideMentions();
          else return false;
          e.preventDefault();
          return true;
        }
        $("mention").addEventListener("mousedown", (e) => {
          const o = e.target.closest(".opt");
          if (!o) return;
          e.preventDefault();
          pickMention(Number(o.dataset.i));
        });

        function renderLibraries(names) {
          const keep = $("library").value;
          $("library").innerHTML = '<option value="">Any library</option><option value="local">This file only</option>' + names.map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
          $("library").value = [...$("library").options].some((o) => o.value === keep) ? keep : "";
        }

        // ---------- selecting a layer on the canvas highlights the note about it ----------
        const noteCovers = (it, path) => it.nodes.some((n) => path.includes(n.id));
        function highlightFor(path) {
          const it = path.length ? items.find((i) => i.status !== "done" && noteCovers(i, path)) || items.find((i) => noteCovers(i, path)) : null;
          hitId = it ? it.id : null;
          document.querySelectorAll(".item.hit").forEach((el) => el.classList.remove("hit"));
          const el = hitId && document.querySelector(`.item[data-id="${hitId}"]`);
          if (el) {
            el.classList.add("hit");
            el.scrollIntoView({ block: "nearest", behavior: "smooth" });
          }
        }
        $("fileUrl").addEventListener("input", () => {
          const key = fileKeyFromUrl($("fileUrl").value);
          $("fileUrl").classList.toggle("bad", !!$("fileUrl").value.trim() && !key);
          if (!key) return updateSend();
          post({ type: "save-file-key", key });
          ctx.fileKey = key;
          $("fileUrl").value = "";
          showSetup();
          updateSend();
          refilter(true);
        });
        $("markers").addEventListener("change", (e) => {
          markersOn = e.target.checked;
          post({ type: "set-pref", key: "markers", value: markersOn });
          syncMarkers();
        });

        // ---------- skills and models the watching Claude Code session offers ----------
        let skillsSig = null;
        function loadSkills(list) {
          const sig = JSON.stringify(list);
          if (sig === skillsSig) return;
          skillsSig = sig;
          const cur = $("skill").value;
          $("skill").innerHTML = '<option value="">None</option>' + list.map((k) => `<option value="${esc(k.name)}" title="${esc(k.description || "")}">${esc(k.name)}</option>`).join("");
          $("skill").value = list.some((k) => k.name === cur) ? cur : "";
          $("skillRow").hidden = !list.length;
          optionsSummary();
        }
        let modelsSig = null;
        function loadModels(list) {
          const sig = JSON.stringify(list);
          if (sig === modelsSig) return;
          modelsSig = sig;
          const cur = $("model").value;
          $("model").innerHTML = '<option value="">Session default</option>' + list.map((m) => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("");
          $("model").value = list.some((m) => m.id === cur) ? cur : "";
          $("modelRow").hidden = !list.length;
          optionsSummary();
        }

        // ---------- Figma token for comments: asked for only when Comments is on and the bridge has none ----------
        let hasCommentsToken = true;
        const showTokenRow = () => ($("tokenRow").hidden = hasCommentsToken || !getComments());
        $("tokenSave").onclick = () => {
          const token = $("figmaToken").value.trim();
          if (!token) return $("figmaToken").focus();
          if (!tell({ type: "note-config", figmaToken: token })) return;
          $("figmaToken").value = "";
          notify("Token saved on this computer");
        };

        // ---------- permission prompts, questions and plans from Claude Code (bridge/hooks) ----------
        let perms = [];
        let permSig = "";
        function permHtml(p) {
          const bubble = (html) => `<div class="bubble">${html}</div>`;
          const head = `<span class="ph2">${p.noteId ? `Note #${esc(p.noteId)} · ` : ""}${{ permission: "Asks for permission", question: "Claude asks you", plan: "Claude’s plan" }[p.kind] || ""}</span>`;
          if (p.kind === "question") {
            return `${bubble(`${head}
              ${(p.questions || [])
                .map(
                  (q, qi) => `<div class="pq" data-q="${qi}" data-multi="${q.multiSelect ? 1 : 0}">
                ${q.header ? `<span class="chip">${esc(q.header)}</span>` : ""}<b>${esc(q.question)}</b>
                <div class="pchoices">${(q.options || []).map((o, oi) => `<button class="pchoice" type="button" data-o="${oi}" title="${esc(o.description || "")}"><span>${esc(o.label)}</span>${o.description ? `<small>${esc(o.description)}</small>` : ""}</button>`).join("")}</div>
                <input class="pother" type="text" placeholder="Or write your own answer…">
              </div>`
                )
                .join("")}`)}
              <div class="pa"><button class="btn ghost sm" type="button" data-decide="skip">Skip</button><span class="grow"></span><button class="btn primary sm" type="button" data-decide="answer">Send answers</button></div>`;
          }
          if (p.kind === "plan") {
            return `${bubble(`${head}
              <div class="pplan">${richText(p.plan || "")}</div>
              <input class="pfeedback" type="text" placeholder="What should change? (for Change)">`)}
              <div class="pa"><button class="btn ghost sm" type="button" data-decide="revise">Change</button><span class="grow"></span><button class="btn primary sm" type="button" data-decide="approve">Approve plan</button></div>`;
          }
          return `${bubble(`${head}
            <b>${esc(p.title || "")}</b>
            ${p.sub ? `<span class="sub">${esc(p.sub)}</span>` : ""}
            ${p.detail ? `<details><summary>Details</summary><pre>${esc(p.detail)}</pre></details>` : ""}`)}
            <div class="pa">
              <button class="btn ghost sm" type="button" data-decide="deny">Decline</button>
              <span class="grow"></span>
              <button class="btn ghost sm" type="button" data-decide="always" title="${esc("Don't ask again for " + (p.rule || "this"))}">Always allow</button>
              <button class="btn primary sm" type="button" data-decide="once">Allow once</button>
            </div>`;
        }
        function renderPerms() {
          const sig = perms.map((p) => p.id).join();
          renderBadge();
          if (sig === permSig) return;
          const fresh = perms.some((p) => !permSig.split(",").includes(p.id));
          permSig = sig;
          const box = $("perms");
          box.hidden = !perms.length;
          box.innerHTML = perms.map((p) => `<div class="perm" data-perm="${esc(p.id)}" data-kind="${esc(p.kind || "permission")}">${permHtml(p)}</div>`).join("");
          if (fresh) {
            notify({ question: "Claude has a question for you", plan: "Claude made a plan for you to approve" }[perms.at(-1)?.kind] || "Claude needs your permission");
            if (!notesOpen) open(false);
          }
        }
        $("perms").addEventListener("click", (e) => {
          const choice = e.target.closest(".pchoice");
          if (choice) {
            const q = choice.closest(".pq");
            if (q.dataset.multi !== "1") q.querySelectorAll(".pchoice").forEach((x) => x !== choice && x.classList.remove("on"));
            choice.classList.toggle("on");
            return;
          }
          const b = e.target.closest("[data-decide]");
          if (!b) return;
          const card = b.closest("[data-perm]");
          const id = card.dataset.perm;
          const p = perms.find((x) => x.id === id) || {};
          const body = { type: "perm-answer", id, decision: b.dataset.decide };
          if (p.kind === "question" && body.decision === "answer") {
            body.answers = {};
            for (const el of card.querySelectorAll(".pq")) {
              const q = p.questions[Number(el.dataset.q)];
              const picked = [...el.querySelectorAll(".pchoice.on")].map((x) => q.options[Number(x.dataset.o)].label);
              const own = el.querySelector(".pother").value.trim();
              if (own) picked.push(own);
              if (!picked.length) {
                notify("Pick an answer for every question, or Skip");
                el.querySelector(".pother").focus();
                return;
              }
              body.answers[q.question] = picked.join(", ");
            }
          }
          if (p.kind === "plan" && body.decision === "revise") {
            body.feedback = card.querySelector(".pfeedback").value.trim();
            if (!body.feedback) {
              notify("Write what should change");
              card.querySelector(".pfeedback").focus();
              return;
            }
          }
          if (!tell(body)) return;
          card.querySelectorAll("button, input").forEach((x) => (x.disabled = true));
          perms = perms.filter((x) => x.id !== id);
          renderPerms();
        });

        function syncMarkers() {
          post({ type: "sync-markers", enabled: markersOn, items: items.map((it) => ({ id: it.id, status: it.status, note: it.note, nodeIds: it.nodes.map((n) => n.id) })) });
        }

        // three states: bridge off / bridge on but no Claude watching / Claude ready
        let connState = "";
        function setOnline(v, isClaude) {
          online = v;
          claude = v && isClaude;
          const state = !v ? "off" : claude ? "ready" : "idle";
          if (state !== connState) {
            connState = state;
            renderHelp();
            showSetup();
            if (state === "off") renderWelcome();
            else if (!items.length && notesOpen) renderList();
          }
          updateSend();
        }
        function renderHelp() {
          const h = {
            off: { text: "Nothing connects me to this file yet. Open Claude Code, or in the Angelo folder run:", cmd: "npm run bridge" },
            idle: { text: "I’m not watching yet. Notes wait here. To start, type in Claude Code:", cmd: "/angelo-notes" },
            ready: { text: "", cmd: "" },
          }[connState];
          if (!h) return;
          $("help").hidden = false;
          $("helpText").hidden = !h.text;
          $("helpText").textContent = h.text;
          $("helpCmdRow").hidden = !h.cmd;
          $("helpCmd").textContent = h.cmd;
          $("helpReady").hidden = connState !== "ready";
          $("helpLbl").hidden = connState === "ready";
          $("help").classList.toggle("ready", connState === "ready");
        }
        // compact header: sticks over the list, shown again as soon as the list moves up
        let lastTop = 0;
        $("scroll").addEventListener(
          "scroll",
          () => {
            const top = $("scroll").scrollTop;
            const help = $("help");
            if (top <= 0 || top < lastTop) help.classList.remove("tuck");
            else if (top > lastTop && top > help.offsetHeight) help.classList.add("tuck");
            lastTop = top;
          },
          { passive: true }
        );
        // delete every note of this file, after a confirmation in the header (no browser dialog in a plugin)
        let clearTimer = 0;
        function clearAsk(open) {
          clearTimeout(clearTimer);
          $("hacts").hidden = open;
          $("clearAsk").hidden = !open;
          if (!open) return;
          $("clearMsg").textContent = `Delete ${items.length} note${items.length > 1 ? "s" : ""}?`;
          clearTimer = setTimeout(() => clearAsk(false), 5000);
        }
        $("clearAll").onclick = () => items.length && clearAsk(true);
        $("clearNo").onclick = () => clearAsk(false);
        $("clearYes").onclick = () => {
          for (const it of items.slice()) {
            post({ type: "clear-markers", id: it.id, nodeIds: it.nodes.map((n) => n.id) });
            tell({ type: "note-delete", id: it.id });
          }
          clearAsk(false);
        };
        $("helpCopy").onclick = () => {
          const ta = document.createElement("textarea");
          ta.value = $("helpCmd").textContent;
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch {}
          ta.remove();
          notify(ok ? "Copied" : "Select the text and copy it");
        };

        // ---------- the notes ----------
        const LABEL = { pending: "Waiting", working: "Working", question: "Needs answer", done: "Done" };
        const staticKind = (kind) => /^(att|t|m)\d+$/.test(kind);
        const imgKey = (it, kind) => (staticKind(kind) ? `${it.id}:${kind}` : `${it.id}:${kind}:${it.updatedAt}`);
        const imgStyle = (it, kind) => {
          const u = imgCache.get(imgKey(it, kind));
          return u ? `style="background-image:url(${u})"` : "";
        };

        function mediaHtml(it) {
          const at = it.attachments || [];
          const shots =
            it.nodes.length > 1
              ? it.nodes.map((n, i) => (n.hasImage ? `<span class="ph sm" title="${esc(n.name)}" data-img="${it.id}:t${i + 1}" ${imgStyle(it, "t" + (i + 1))}></span>` : "")).join("")
              : "";
          const fl = at
            .map((a) =>
              a.mime.startsWith("image/")
                ? `<span class="ph" title="${esc(a.name)}" data-img="${it.id}:att${a.n}" ${imgStyle(it, "att" + a.n)}></span>`
                : `<span class="fchip" title="${esc(a.name)}"><span class="ext">${esc((extOf(a.name) || "file").slice(0, 4).toUpperCase())}</span><span class="fn">${esc(a.name)}</span>${a.size ? `<span class="muted">${fmtSize(a.size)}</span>` : ""}</span>`
            )
            .join("");
          return shots || fl ? `<div class="media">${shots}${fl}</div>` : "";
        }

        function itemHtml(it) {
          const lastPlan = it.status === "question" && it.thread.at(-1)?.kind === "plan";
          const thread = it.thread
            .map(
              (t, i) =>
                `<div class="msg ${t.from}${t.kind === "plan" ? " plan" : ""}">${t.from === "system" ? "" : `<small>${t.from === "claude" ? (t.kind === "plan" ? "Claude plan" : "Claude") : "You"}</small>`}${t.from === "claude" ? richText(t.text) : esc(t.text)}${
                  (t.images || []).length
                    ? `<div class="refs">${t.images.map((im) => `<span class="ref${im.link ? " linked" : ""}" ${im.link ? `data-href="${esc(im.link)}"` : ""} title="${esc(im.caption || im.link || "")}"><span class="ph" data-img="${it.id}:m${im.k}" ${imgStyle(it, "m" + im.k)}></span>${im.caption ? `<small>${esc(im.caption)}</small>` : ""}</span>`).join("")}</div>`
                    : ""
                }${lastPlan && i === it.thread.length - 1 ? `<div class="pa"><button class="btn ghost sm" type="button" data-plan-change="${it.id}">Change something</button><span class="grow"></span><button class="btn primary sm" type="button" data-plan-ok="${it.id}">Approve plan</button></div>` : ""}</div>`
            )
            .join("");
          const meta = [
            it.priority === "urgent" ? "urgent" : "",
            it.variations > 1 ? `${it.variations} versions` : "",
            it.library ? `library: ${it.library === "local" ? "this file" : it.library}` : "",
            (it.mentions || []).length ? "@ " + it.mentions.map((m) => m.name).join(", ") : "",
            it.useComments ? (it.useComments === "summarize" ? "summarize comments" : "apply comments") : "",
            it.model ? it.modelName || it.model : "",
            it.skill ? "skill: " + it.skill : "",
            it.planFirst ? "plan first" : "",
            it.references ? `${it.references.count} refs` : "",
            it.batchMode === "parallel" ? "parallel" : "",
          ]
            .filter(Boolean)
            .join(" · ");
          const showCmp = it.status === "done" && it.hasBefore && it.hasAfter;
          const canUndo = it.status === "done" && it.hasPatch && !it.reverted;
          const replyOpen = !it.reverted && (it.status === "question" || openReplies.has(it.id) || replyDrafts[it.id]);
          const placeholder = { question: "Answer Claude…", done: "Not quite right? Say why…", working: "Add something while Claude works…", pending: "Add to this note…" }[it.status];
          const st = it.reverted ? "reverted" : it.status;
          const steps = it.progress || [];
          const progress = !steps.length
            ? ""
            : it.status === "working"
              ? `<div class="prog">${steps.slice(0, -1).slice(-3).map((p) => `<div class="done">${esc(p.text)}</div>`).join("")}<div class="now">${esc(steps.at(-1).text)}</div></div>`
              : openSteps.has(it.id)
                ? `<div class="prog">${steps.map((p) => `<div class="done">${esc(p.text)}</div>`).join("")}</div>`
                : "";
          const hasSteps = steps.length && it.status !== "working";
          const chev = hasSteps ? `<button class="ib chev${openSteps.has(it.id) ? " on" : ""}" type="button" data-steps="${it.id}" title="Steps">${ICON.chev}</button>` : "";
          const stepsN = hasSteps ? `<span class="n" data-steps="${it.id}">${steps.length} step${steps.length > 1 ? "s" : ""}</span>` : "";
          return `<article class="item${it.id === hitId ? " hit" : ""}" data-id="${it.id}">
            <div class="head"><div class="top"><span class="who" title="${esc(nodeLabel(it.nodes, it.scope))}">#${it.id} ${esc(nodeLabel(it.nodes, it.scope))}${it.batchId ? " · batch" : ""}${it.agent ? ` · ${esc([it.agent, ...(it.helpers || [])].join(" + "))}` : ""}</span><span class="st ${st}">${waitsFigma(it) ? "waiting for figma" : (it.reverted ? "Reverted" : LABEL[it.status] || it.status).toLowerCase()}</span></div>
            <div class="you">${esc(it.note)}</div>
            ${meta ? `<div class="meta">${esc(meta)}</div>` : ""}${mediaHtml(it)}</div>${thread}${progress}
            ${showCmp ? `<div class="cmp"><figure><div class="img" data-img="${it.id}:before" ${imgStyle(it, "before")}></div><figcaption>Before</figcaption></figure><figure><div class="img" data-img="${it.id}:after" ${imgStyle(it, "after")}></div><figcaption>After</figcaption></figure></div>` : ""}
            ${replyOpen ? `<div class="reply"><input class="replyInput" type="text" data-id="${it.id}" value="${esc(replyDrafts[it.id] || "")}" placeholder="${placeholder}"></div>` : ""}
            <div class="acts">
              ${chev}<span class="grp">${stepsN}
              ${it.focus && it.focus.length ? `<button class="tl" type="button" data-select="${it.id}">Select</button>` : ""}
              ${canUndo ? `<button class="tl" type="button" data-undo="${it.id}">Undo</button>` : ""}</span>
              <span class="grow"></span>
              <span class="end">
              ${!it.reverted && !replyOpen ? `<button class="ib" type="button" data-reply="${it.id}" title="Reply">${ICON.reply}</button>` : ""}
              <button class="ib" type="button" data-del="${it.id}" title="Delete">${ICON.trash}</button></span>
            </div>
          </article>`;
        }

        const openSteps = new Set();
        let figmaWait = new Set();
        const waitsFigma = (it) => it.status === "working" && !!it.agent && figmaWait.has(it.agent);
        // only the notes that changed are redrawn, so scrolling, typing and pictures stay put
        const itemSig = (it) => JSON.stringify([it.updatedAt, it.status, it.thread.length, (it.progress || []).length, it.reverted, (it.focus || []).length, !!it.hasPatch, it.hasBefore, it.hasAfter, openReplies.has(it.id), !!replyDrafts[it.id], openSteps.has(it.id), it.agent || "", (it.helpers || []).join(), waitsFigma(it)]);
        // first run, or no bridge: what the panel needs, so it explains itself
        const WELCOME = `<div class="empty">Select a layer, write what should change and send. Nothing leaves your computer.</div>`;
        function renderWelcome() {
          if (items.length) return;
          $("list").innerHTML = WELCOME;
          shownCount = 0;
        }

        function renderList() {
          renderBadge();
          $("clearAll").hidden = !items.length;
          const list = $("list");
          if (!items.length && connState === "off") return renderWelcome();
          if (!items.length) {
            list.innerHTML = `<div class="empty">Select layers, a frame or nothing for the whole page, then write what should change.</div>`;
            shownCount = 0;
            return;
          }
          const emptyEl = list.querySelector(".empty");
          if (emptyEl) emptyEl.remove();
          const sc = $("scroll");
          const atBottom = sc.scrollHeight - sc.scrollTop - sc.clientHeight < 40;
          const grew = items.length > shownCount;
          shownCount = items.length;
          const seen = new Set();
          let prev = null;
          for (const it of items) {
            seen.add(it.id);
            let el = list.querySelector(`.item[data-id="${it.id}"]`);
            const sig = itemSig(it);
            const typing = el && document.activeElement && el.contains(document.activeElement);
            if ((!el || el.dataset.sig !== sig) && !typing) {
              const tmp = document.createElement("div");
              tmp.innerHTML = itemHtml(it).trim();
              const fresh = tmp.firstElementChild;
              fresh.dataset.sig = sig;
              if (el) el.replaceWith(fresh);
              else if (prev) prev.after(fresh);
              else list.prepend(fresh);
              el = fresh;
            }
            if (prev ? prev.nextElementSibling !== el : list.firstElementChild !== el) {
              if (prev) prev.after(el);
              else list.prepend(el);
            }
            prev = el;
          }
          list.querySelectorAll(".item").forEach((el) => {
            if (!seen.has(el.dataset.id)) el.remove();
          });
          if (grew || atBottom) sc.scrollTop = sc.scrollHeight;
          loadImages();
        }

        // pictures come over the socket (note-img, base64) and are kept as blob URLs
        const imgAsked = new Map(); // "id:kind" → the cache key asked for
        function loadImages() {
          for (const it of items) {
            const kinds = [];
            if (it.nodes.length > 1) it.nodes.forEach((n, i) => n.hasImage && kinds.push("t" + (i + 1)));
            (it.attachments || []).forEach((a) => a.mime.startsWith("image/") && kinds.push("att" + a.n));
            it.thread.forEach((t) => (t.images || []).forEach((im) => kinds.push("m" + im.k)));
            if (it.status === "done" && it.hasBefore && it.hasAfter) kinds.push("before", "after");
            for (const kind of kinds) {
              const key = imgKey(it, kind);
              if (imgCache.has(key) || imgAsked.get(`${it.id}:${kind}`) === key) continue;
              imgAsked.set(`${it.id}:${kind}`, key);
              send({ type: "note-img", id: it.id, kind });
            }
          }
        }
        function onImage(f) {
          const key = imgAsked.get(`${f.id}:${f.kind}`);
          if (!key || f.missing || !f.data) return;
          const bin = atob(f.data);
          const bytes = new Uint8Array(bin.length);
          for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
          const old = imgCache.get(key);
          if (old) URL.revokeObjectURL(old);
          const url = URL.createObjectURL(new Blob([bytes], { type: f.mime || "image/png" }));
          imgCache.set(key, url);
          const el = document.querySelector(`[data-img="${f.id}:${f.kind}"]`);
          if (el) el.style.backgroundImage = `url(${url})`;
        }

        // click a note: go to its layers
        function focusNote(it) {
          const ids = it.nodes.map((n) => n.id);
          if (ids.length) post({ type: "focus", ids });
        }
        function redrawItem(id) {
          const el = document.querySelector(`.item[data-id="${id}"]`);
          if (!el) return;
          el.dataset.sig = "";
          renderList();
        }

        $("list").addEventListener("click", (e) => {
          const link = e.target.closest("a[data-href], .ref.linked");
          if (link) {
            e.preventDefault();
            e.stopPropagation();
            post({ type: "open-url", url: link.dataset.href });
            return;
          }
          const planOk = e.target.closest("[data-plan-ok]");
          if (planOk) {
            planOk.disabled = true;
            sendReply(planOk.dataset.planOk, "Plan approved. Go ahead.");
            return;
          }
          const planChange = e.target.closest("[data-plan-change]");
          if (planChange) {
            const id = planChange.dataset.planChange;
            openReplies.add(id);
            redrawItem(id);
            const input = document.querySelector(`.replyInput[data-id="${id}"]`);
            if (input) {
              input.placeholder = "What should change in the plan?";
              input.focus();
            }
            return;
          }
          const stepsBtn = e.target.closest("[data-steps]");
          if (stepsBtn) {
            const id = stepsBtn.dataset.steps;
            if (openSteps.has(id)) openSteps.delete(id);
            else openSteps.add(id);
            redrawItem(id);
            return;
          }
          const select = e.target.closest("[data-select]");
          if (select) {
            const it = items.find((i) => i.id === select.dataset.select);
            if (it && it.focus) post({ type: "focus", ids: it.focus });
            return;
          }
          const undo = e.target.closest("[data-undo]");
          if (undo) {
            if (tell({ type: "note-undo", id: undo.dataset.undo })) {
              undo.disabled = true;
              notify("Reverting…");
            }
            return;
          }
          const reply = e.target.closest("[data-reply]");
          if (reply) {
            const id = reply.dataset.reply;
            openReplies.add(id);
            redrawItem(id);
            const input = document.querySelector(`.replyInput[data-id="${id}"]`);
            if (input) input.focus();
            return;
          }
          const del = e.target.closest("[data-del]");
          if (del) {
            const it = items.find((i) => i.id === del.dataset.del);
            if (it) post({ type: "clear-markers", id: it.id, nodeIds: it.nodes.map((n) => n.id) });
            tell({ type: "note-delete", id: del.dataset.del });
            return;
          }
          if (e.target.closest(".reply")) return;
          const item = e.target.closest(".item");
          if (item) {
            const it = items.find((i) => i.id === item.dataset.id);
            if (it) focusNote(it);
          }
        });
        $("list").addEventListener("input", (e) => {
          if (e.target.classList.contains("replyInput")) replyDrafts[e.target.dataset.id] = e.target.value;
        });
        $("list").addEventListener("focusout", (e) => {
          if (!e.target.classList.contains("replyInput")) return;
          const id = e.target.dataset.id;
          if (!e.target.value.trim()) {
            delete replyDrafts[id];
            openReplies.delete(id);
          }
          setTimeout(() => renderList()); // anything that changed while typing
        });
        $("list").addEventListener("keydown", (e) => {
          if (!e.target.classList.contains("replyInput")) return;
          const id = e.target.dataset.id;
          if (e.key === "Escape") {
            e.target.value = "";
            e.target.blur();
            return;
          }
          if (e.key !== "Enter" || e.isComposing) return;
          const text = e.target.value.trim();
          if (!text) return;
          e.target.value = "";
          e.target.blur();
          sendReply(id, text);
        });
        function sendReply(id, text) {
          if (!tell({ type: "note-reply", id, text })) return;
          delete replyDrafts[id];
          openReplies.delete(id);
        }

        // ---------- keyboard ----------
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && !$("opts").hidden) setOpts(false);
        });

        // ---------- resizing the panel from its corner (the top edge stays put) ----------
        (() => {
          let start = null;
          let raf = 0;
          let next = null;
          const grip = $("grip");
          grip.addEventListener("pointerdown", (e) => {
            e.preventDefault();
            try {
              grip.setPointerCapture(e.pointerId);
            } catch (err) {}
            start = { x: e.screenX, y: e.screenY, w: window.innerWidth || normalSize.w, h: window.innerHeight || normalSize.h };
            next = null;
          });
          grip.addEventListener("pointermove", (e) => {
            if (!start) return;
            const w = Math.min(900, Math.max(mini ? 240 : 300, start.w + e.screenX - start.x));
            next = mini ? { w, h: miniH() } : { w, h: Math.min(1200, Math.max(420, start.h + e.screenY - start.y)) };
            if (!raf) {
              raf = requestAnimationFrame(() => {
                raf = 0;
                if (next) post({ type: "resize", w: next.w, h: next.h });
              });
            }
          });
          const end = () => {
            if (!start) return;
            start = null;
            if (!next) return;
            if (mini) {
              miniW = next.w;
              post({ type: "set-pref", key: "miniW", value: miniW });
              return;
            }
            normalSize = next;
            post({ type: "set-pref", key: "size", value: next });
          };
          grip.addEventListener("pointerup", end);
          grip.addEventListener("pointercancel", end);
        })();

        window.Notes = { frame, main, connected, quick, attach };
        post({ type: "ready" });
        renderTarget();
        renderFiles();
        optionsSummary();
        setOnline(isOpen(), false);
        if (isOpen()) connected(true);
      })();
    </script>
    <script>
      // Onboarding: first run, three steps over the panel (welcome, AI client, test).
      // Completion is kept by the main thread (figma.clientStorage); the Guide link replays it.
      // It reads the bar's socket and is told of each bridge request and of its answer.
      (() => {
        const $ = (id) => document.getElementById(id);
        const post = (m) => parent.postMessage({ pluginMessage: { kind: "onboarding", ...m } }, "*");
        const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
        const up = () => !!socket && socket.readyState === 1;
        const STEPS = ["welcome", "client", "test"];
        const TEST_PROMPT = "Use Angelo to read my Figma selection";
        // the Claude Desktop extension ships inside the npm package
        const DESKTOP_URL = "https://unpkg.com/angelo-mcp/angelo.mcpb";
        let at = "welcome"; // the step shown, by name
        let client = "code";
        let replay = false; // opened from the Guide link: every step is shown
        let trip = null; // the first bridge request answered while the guide is shown: { method, ms, ok, error }
        const asked = new Map();

        const NPX = { command: "npx", args: ["-y", "angelo-mcp"] };
        const CLIENTS = {
          code: {
            label: "Claude Code",
            where: "Paste this in a terminal, then start a new Claude Code session.",
            snippet: "claude mcp add angelo -s user -- npx -y angelo-mcp",
          },
          desktop: {
            label: "Claude Desktop",
            where: "Download the extension and double-click it: Claude Desktop installs Angelo.",
          },
          other: {
            label: "Cursor / other",
            where: "Cursor: ~/.cursor/mcp.json. Any MCP client that runs a stdio server takes the same entry.",
            snippet: JSON.stringify({ mcpServers: { angelo: NPX } }, null, 2),
          },
        };

        const snip = (text) => `<pre title="Click to copy" data-copy="${esc(text)}">${esc(text)}</pre>`;
        const stat = (cls, text) => `<div class="ostat"><span class="dot ${cls}"></span><span>${text}</span></div>`;
        const ARROW =
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';

        // plugin → bridge → your AI, each dot following the connection
        function flow() {
          const part = (cls, label) => `<span><span class="dot ${cls}"></span>${label}</span>`;
          return `<div class="oflow">${part("on", "Plugin")}${ARROW}${part(up() ? "on" : "wait", "Bridge")}${ARROW}${part(trip ? "on" : "wait", "Your AI")}</div>`;
        }
        function bridgeStat() {
          return up() ? stat("on", "Bridge connected: your AI is set.") : stat("wait", "Waiting for your AI to start the bridge…");
        }
        function tripStat() {
          if (trip) {
            const tail = trip.ok ? "" : ` It answered: ${esc(trip.error)}`;
            return stat("on", `Your AI reached Figma: ${esc(trip.method)} answered in ${trip.ms} ms.${tail}`);
          }
          return up() ? stat("wait", "Waiting for a request from your AI…") : stat("err", "The bridge is not connected yet. Your AI client starts it with its first Angelo call.");
        }
        function clientHtml() {
          const c = CLIENTS[client];
          const action = c.snippet ? snip(c.snippet) : `<button class="btn dl" type="button" data-open="${DESKTOP_URL}">Download for Claude Desktop</button>`;
          return `<p>${esc(c.where)}</p>${action}${bridgeStat()}`;
        }
        function testHtml() {
          if (!trip) return `${tripStat()}<p>This turns green when a request from your AI comes through the bridge and Figma answers it.</p>`;
          return `${tripStat()}<p>· Keep this panel open while you work.<br>· Notes written here wait for your AI.</p>`;
        }

        const BODY = {
          welcome: () => `<h2>Welcome to Angelo</h2>
            <p>Angelo turns your Figma selection into compact text your AI can read and edit, with no copy and paste.</p>
            <div id="onbLive">${flow()}</div>
            <p>Nothing leaves your computer.</p>`,
          client: () => `<h2>Connect your AI</h2>
            <p>Pick the app you use with AI:</p>
            <div class="seg" id="onbClient">${Object.entries(CLIENTS)
              .map(([k, c]) => `<button type="button" data-v="${k}"${k === client ? ' class="on"' : ""}>${c.label}</button>`)
              .join("")}</div>
            <div id="onbLive">${clientHtml()}</div>`,
          test: () => `<h2>Test it</h2>
            <p>Select a frame in Figma, then tell your AI:</p>${snip(TEST_PROMPT)}
            <div id="onbLive">${testHtml()}</div>`,
        };
        // the part of a step that follows the connection
        function live() {
          const el = $("onbLive");
          if (!el || $("onb").hidden) return;
          if (at === "welcome") el.innerHTML = flow();
          if (at === "client") el.innerHTML = clientHtml();
          if (at === "test") render();
        }

        function render() {
          const last = at === "test";
          $("onbCount").textContent = `${STEPS.indexOf(at) + 1} of ${STEPS.length}`;
          $("onbBody").innerHTML = BODY[at]();
          $("onbBody").scrollTop = 0;
          $("onbBack").hidden = at === "welcome";
          $("onbSkip").hidden = last && !!trip;
          $("onbNext").textContent = at === "welcome" ? "Get started" : last ? (trip ? "Start using Angelo" : "Finish") : "Next";
        }
        function show(fromGuide = false) {
          replay = fromGuide;
          at = "welcome";
          trip = null;
          asked.clear();
          render();
          $("onb").hidden = false;
        }
        function close() {
          $("onb").hidden = true;
          post({ type: "set", done: true });
        }

        $("onbSkip").onclick = close;
        $("onbBack").onclick = () => {
          at = STEPS[Math.max(0, STEPS.indexOf(at) - 1)];
          render();
        };
        // a connected bridge means an AI client already runs Angelo: its setup step is passed over,
        // except when the guide is replayed
        $("onbNext").onclick = () => {
          if (at === "test") return close();
          at = at === "welcome" && up() && !replay ? "test" : STEPS[STEPS.indexOf(at) + 1];
          render();
        };
        // Alt-click also forgets the completion: the next launch opens the guide by itself
        $("guide").onclick = (e) => {
          if (e.altKey) post({ type: "set", done: false });
          show(true);
        };
        $("onbBody").addEventListener("click", (e) => {
          const tab = e.target.closest("#onbClient button");
          if (tab) {
            client = tab.dataset.v;
            for (const b of $("onbClient").children) b.classList.toggle("on", b === tab);
            return live();
          }
          const open = e.target.closest("[data-open]");
          if (open) return post({ type: "open", url: open.dataset.open });
          const copy = e.target.closest("[data-copy]");
          if (!copy) return;
          const ta = document.createElement("textarea");
          ta.value = copy.dataset.copy;
          document.body.appendChild(ta);
          ta.select();
          let ok = false;
          try {
            ok = document.execCommand("copy");
          } catch {}
          ta.remove();
          // brief feedback in place of the text, then the text again
          if (copy.classList.contains("copied")) return;
          copy.classList.add("copied");
          copy.textContent = ok ? "Copied" : "Select the text and copy it";
          setTimeout(() => {
            copy.classList.remove("copied");
            copy.textContent = copy.dataset.copy;
          }, 1200);
        });

        window.Onboarding = {
          // stored state from the main thread: shown by itself until it was finished or skipped once
          main(m) {
            if (m.type === "state" && !m.done) show();
          },
          bridge: live,
          request(frame) {
            if (!$("onb").hidden && !trip) asked.set(frame.id, { method: frame.method, at: Date.now() });
          },
          response(r) {
            const a = asked.get(r.id);
            if (!a || trip) return;
            asked.clear();
            const failed = !r.ok ? r.error : r.result && r.result.error;
            trip = { method: a.method, ms: Date.now() - a.at, ok: !failed, error: failed ? String(failed).split("\n")[0] : "" };
            live();
          },
        };
        post({ type: "get" });
      })();
    </script>
  </body>
</html>
